name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies (CPU xgboost)
        run: |
          python -m pip install --upgrade pip
          pip install "xgboost==2.1.3" --no-deps
          grep -v "^xgboost" backend/requirements.txt > /tmp/req-no-xgb.txt
          pip install -r /tmp/req-no-xgb.txt

      - name: Seed test users
        env:
          APP_ENV: development
        run: |
          python scripts/seed_users.py

      - name: Run tests
        env:
          APP_ENV: development
          SECRET_KEY: dev-insecure-secret-key-change-in-production
          PYTHONPATH: .
        run: |
          pytest tests/ -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build frontend
        run: npm run build
